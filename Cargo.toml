[package]
name = "rift"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
ssh2 = { version = "0.9.6", features = [] }
keyring = { version = "3", features = ["linux-native-sync-persistent", "windows-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
uuid = { version = "1.11", features = ["v4"] }
crossbeam-channel = "0.5"
hex = "0.4"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.16"
